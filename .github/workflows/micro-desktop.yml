name: Micro desktop release

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag to merge, such as v0.0.46 or v0.0.46-nightly.20261009.2873. Empty uses the latest stable release."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: micro-desktop-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'nielsb02/t3code'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          # Sparse checkout enables a partial clone. Git 2.55 can fail while
          # fetching missing objects during the upstream merge, so fetch fully.

      - name: Verify the sync policy
        run: python3 .github/scripts/micro_sync_test.py

      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Find the upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_REF:-}"
          if [[ -z "$tag" ]]; then
            tag="$(gh api repos/pingdotgg/t3code/releases/latest --jq .tag_name)"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected release tag" >&2; exit 1; }
          fi
          # Validates stable and nightly tags; previews are rejected.
          python3 .github/scripts/micro_sync.py version "$tag" 0 > /dev/null
          git fetch --no-tags https://github.com/pingdotgg/t3code.git \
            "+refs/tags/$tag:refs/remotes/upstream/release" "+refs/heads/main:refs/remotes/upstream/main"
          git merge-base --is-ancestor refs/remotes/upstream/release refs/remotes/upstream/main \
            || { echo "$tag is not on upstream main" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Merge upstream while retaining the fork changes
        id: sync
        run: python3 .github/scripts/micro_sync.py merge refs/remotes/upstream/release

      - name: Record the monthly update check
        id: state
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          SOURCE_CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          path = Path(".github/micro-sync-state.json")
          previous = json.loads(path.read_text()) if path.exists() else {}
          # An already-included tag can be older than a nightly merged earlier.
          included = os.environ["UPSTREAM_TAG"] if os.environ["SOURCE_CHANGED"] == "true" else previous["includedUpstream"]
          state = {
              "upstreamRelease": os.environ["UPSTREAM_TAG"],
              "includedUpstream": included,
              "checkedMonth": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m"),
          }
          path.write_text(json.dumps(state, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"included={included}\n")
          PY
          git add .github/micro-sync-state.json
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m 'chore: record upstream release check'
          fi

      - name: Verify the fork adds no database migrations
        env:
          INCLUDED_TAG: ${{ steps.state.outputs.included }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/pingdotgg/t3code.git "+refs/tags/$INCLUDED_TAG:refs/remotes/upstream/included"
          python3 .github/scripts/micro_sync.py check-migrations refs/remotes/upstream/included

      - name: Decide whether a build is needed
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          if [[ "$EVENT_NAME" != schedule || "$SOURCE_CHANGED" == true ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vite+
        if: steps.plan.outputs.build == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        if: steps.plan.outputs.build == 'true'
        run: vp install --filter=@t3tools/desktop... --filter=@t3tools/web... --filter=t3... --filter=@t3tools/scripts...

      - name: Verify Micro sessions, controls, settlement actions, and affected types
        if: steps.plan.outputs.build == 'true'
        run: |
          vp test run \
            apps/desktop/src/app/DesktopAppActivation.test.ts \
            apps/desktop/src/app/DesktopAppActivationBroker.test.ts \
            apps/web/src/desktopAppActivation.test.ts \
            apps/web/src/desktopSessions.test.ts \
            packages/contracts/src/desktopSessions.test.ts \
            apps/web/src/microControls.test.ts \
            apps/web/src/projectScripts.test.ts \
            apps/web/src/session-logic.test.ts \
            apps/web/src/components/chat/MessagesTimeline.logic.test.ts \
            packages/contracts/src/t3ProjectFile.test.ts \
            apps/server/src/project/ProjectSettleScriptRunner.test.ts \
            apps/server/src/project/WorktreeOperationGuard.test.ts \
            apps/server/src/project/AgentSessionImporter.test.ts \
            apps/server/src/git/GitManager.test.ts \
            apps/server/src/git/GitWorkflowService.test.ts \
            apps/server/src/orchestration/Layers/OrchestrationEngine.test.ts \
            apps/server/src/orchestration/Layers/CheckpointReactor.test.ts \
            apps/server/src/orchestration/Layers/ProjectionPipeline.test.ts \
            apps/server/src/orchestration/Layers/ProviderCommandReactor.test.ts \
            apps/server/src/orchestration/Layers/ProviderRuntimeIngestion.test.ts \
            apps/server/src/cli/app.test.ts \
            apps/server/src/server.test.ts \
            apps/server/src/persistence/Migrations/053_ReconcileForkThreadSchema.test.ts \
            apps/server/src/pullRequest/PullRequestService.test.ts \
            apps/server/src/orchestration/PullRequestSyncReactor.test.ts \
            apps/server/src/provider/Layers/CodexSideChat.test.ts \
            apps/web/src/components/MermaidCanvas.test.tsx \
            apps/web/src/components/MermaidDiagram.test.tsx \
            apps/web/src/lib/workspaceDiff.test.ts \
            apps/web/src/lib/diffRendering.test.ts \
            packages/client-runtime/src/state/pullRequests.test.ts
          vp run --filter @t3tools/contracts --filter @t3tools/shared --filter @t3tools/web --filter @t3tools/desktop --filter t3 typecheck

      - name: Setup Rust
        if: steps.plan.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build Apple Silicon desktop
        id: build
        if: steps.plan.outputs.build == 'true'
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          INCLUDED_TAG: ${{ steps.state.outputs.included }}
        run: |
          set -euo pipefail
          version="$(python3 .github/scripts/micro_sync.py version "$INCLUDED_TAG" "$GITHUB_RUN_NUMBER")"
          node scripts/update-release-package-versions.ts "$version"
          cp .env.example .env
          vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --build-version "$version" --verbose
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the packaged app and update feed
        if: steps.plan.outputs.build == 'true'
        env:
          BUILD_VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/micro-package-check"
          ditto -x -k "release/T3-Code-$BUILD_VERSION-arm64.zip" "$unpacked"
          codesign --verify --deep --strict --verbose=2 "$unpacked/T3 Code (Alpha).app"
          node --input-type=module - "$unpacked/T3 Code (Alpha).app/Contents/Resources/app-update.yml" <<'JS'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import { createRequire } from "node:module";
          const YAML = createRequire(`${process.cwd()}/apps/server/package.json`)("yaml");
          const feed = YAML.parse(fs.readFileSync(process.argv[2], "utf8"));
          assert.equal(`${feed.owner}/${feed.repo}`, process.env.GITHUB_REPOSITORY);
          const update = YAML.parse(fs.readFileSync("release/latest-mac.yml", "utf8"));
          assert.equal(update.version, process.env.BUILD_VERSION);
          JS

      - name: Publish the verified source
        run: git push origin HEAD:main

      - name: Publish desktop downloads
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ steps.build.outputs.version }}
          INCLUDED_TAG: ${{ steps.state.outputs.included }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*.dmg release/*.zip release/latest-mac.yml release/*.blockmap)
          (( ${#assets[@]} >= 2 )) || { echo 'Desktop artifacts are missing' >&2; exit 1; }
          commit="$(git rev-parse HEAD)"
          {
            echo "T3 Code with desktop session opening, dial and joystick navigation, and assignable actions for Micro Manager."
            echo
            echo "Choose this app in Micro Manager, then configure and apply the controls on your T3 layer. Dial and action controls operate while this T3 app is frontmost."
            echo
            echo "Version: $BUILD_VERSION. Includes upstream $INCLUDED_TAG and the fork's retained changes."
            echo
            echo "Apple Silicon macOS build. Ad-hoc signed, not notarized; manual installation may be required."
            echo "Close T3 before replacing your app. Select this installation in Micro Manager's desktop app setting."
            echo
            echo "Source: https://github.com/$GITHUB_REPOSITORY/commit/$commit"
            echo "Updates: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/operations/micro-fork.md"
          } > "$RUNNER_TEMP/micro-release-notes.md"
          gh release create "v$BUILD_VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$commit" --title "T3 Code Micro $BUILD_VERSION" --notes-file "$RUNNER_TEMP/micro-release-notes.md" --latest

      - name: Explain a failed update
        if: failure()
        run: |
          echo '### Micro update needs attention' >> "$GITHUB_STEP_SUMMARY"
          echo 'No new desktop release was published. Review the failed step; the previous download remains available.' >> "$GITHUB_STEP_SUMMARY"
